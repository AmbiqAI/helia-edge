name: HeliaEdge CI

on: [push, pull_request]

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12
      - run: uv pip install . pytest ruff
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync pytest -q tests/test_import_isolation.py tests/utils/test_aws.py

  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [tensorflow, torch]
        python: ['3.12', '3.13', '3.14']
        exclude:
          - backend: tensorflow
            python: '3.14'
    env:
      KERAS_BACKEND: ${{ matrix.backend }}
      HELIA_REQUIRE_ISOLATION: '1'
      CUDA_VISIBLE_DEVICES: '-1'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python ${{ matrix.python }}
      - if: matrix.backend == 'torch'
        run: uv pip install 'torch==2.14.0' --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install '.[${{ matrix.backend }}]' 'keras==3.15.1' pytest
      - if: matrix.backend == 'tensorflow'
        run: uv pip install 'ai-edge-litert==2.2.0'
      - if: matrix.backend == 'tensorflow'
        run: uv run --no-sync pytest -q
      - if: matrix.backend == 'torch'
        run: >-
          uv run --no-sync pytest -q tests/test_import_isolation.py tests/test_serialization.py
          tests/metrics tests/layers/test_ema_residual_vector_quantizer.py tests/utils/test_aws.py tests/trainers
      - run: uv run --no-sync python examples/masked_autoencoder_native.py --evidence mae-evidence.npz
      - if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: mae-${{ matrix.backend }}
          path: mae-evidence.npz

  parity:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12
      - run: uv pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: mae-*
          path: evidence
      - run: >-
          uv run --no-sync python benchmarks/compare_mae_backends.py
          --tensorflow-evidence evidence/mae-tensorflow/mae-evidence.npz
          --torch-evidence evidence/mae-torch/mae-evidence.npz
