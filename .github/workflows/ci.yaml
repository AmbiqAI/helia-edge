name: HeliaEdge CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12 --only-group docs --locked
      - run: uv run --no-sync mkdocs build --strict

  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12
      - run: uv pip install 'torch==2.14.0' --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install '.[tensorflow,torch,litert,plotting,aws]' --group typing
      - run: uv run --no-sync ty check --error-on-warning

  base:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python ${{ matrix.python }} --locked --no-dev --group ci --no-editable
      - name: Check installed lazy exports outside the source tree
        run: |
          uv run --no-sync python -I - <<'PY'
          import importlib.util
          import sys
          import helia_edge
          assert helia_edge.utils.StreamMode.FINITE.value == 'finite'
          absent = ('keras', 'tensorflow', 'torch', 'matplotlib', 'pandas', 'sklearn', 'plotly', 'seaborn', 'boto3', 'botocore', 'h5py', 'scipy')
          assert all(importlib.util.find_spec(name) is None for name in absent)
          assert not set(absent) & sys.modules.keys()
          PY
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync pytest -q tests/test_import_isolation.py tests/test_optional_dependencies.py tests/utils/test_rng.py

      - name: Test AWS without plotting or a backend
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/edge-aws
        run: |
          uv sync --python ${{ matrix.python }} --locked --no-dev --group ci --extra aws --no-editable
          uv run --no-sync python -I -c "import importlib.util; assert all(importlib.util.find_spec(n) is None for n in ('keras', 'tensorflow', 'torch', 'matplotlib', 'pandas', 'sklearn', 'plotly', 'seaborn', 'h5py', 'scipy'))"
          uv run --no-sync pytest -q tests/utils/test_aws.py tests/test_optional_dependencies.py
      - name: Test plotting without AWS or a backend
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/edge-plotting
          MPLBACKEND: Agg
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: |
          uv sync --python ${{ matrix.python }} --locked --no-dev --group ci --extra plotting --no-editable
          uv run --no-sync python -I -c "import importlib.util; assert all(importlib.util.find_spec(n) is None for n in ('keras', 'tensorflow', 'torch', 'boto3', 'botocore', 'h5py'))"
          uv run --no-sync pytest -q tests/plotting tests/test_optional_dependencies.py

  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [tensorflow, torch]
        python: ['3.12', '3.13', '3.14']
        exclude:
          - backend: tensorflow
            python: '3.14'
    env:
      KERAS_BACKEND: ${{ matrix.backend }}
      HELIA_REQUIRE_ISOLATION: '1'
      CUDA_VISIBLE_DEVICES: '-1'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python ${{ matrix.python }}
      - if: matrix.backend == 'torch'
        run: uv pip install 'torch==2.14.0' --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install '.[${{ matrix.backend }}]' 'keras==3.15.1' pytest
      - if: matrix.backend == 'tensorflow'
        run: uv pip install 'ai-edge-litert==2.2.0'
      - name: Check backend installation excludes plotting and AWS
        run: uv run --no-sync python -I -c "import importlib.util; assert all(importlib.util.find_spec(n) is None for n in ('matplotlib', 'plotly', 'seaborn', 'sklearn', 'boto3', 'botocore'))"
      - if: matrix.backend == 'tensorflow'
        run: >-
          uv run --no-sync pytest -q --ignore=tests/utils/test_aws.py --ignore=tests/plotting
          --ignore=tests/models/test_model_loading.py --ignore=tests/layers/test_patch_visualization.py
      - if: matrix.backend == 'torch'
        run: >-
          uv run --no-sync pytest -q tests/test_import_isolation.py tests/test_serialization.py
          tests/metrics tests/layers/test_ema_residual_vector_quantizer.py tests/test_optional_dependencies.py tests/utils/test_rng.py tests/trainers
      - run: >-
          uv run --no-sync python tests/trainers/mae_parity_fixture.py
          --output '${{ runner.temp }}/mae-evidence.npz'
      - if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: mae-${{ matrix.backend }}
          path: ${{ runner.temp }}/mae-evidence.npz

      - name: Test backend integration with plotting and AWS
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: |
          uv pip install '.[plotting,aws]'
          uv run --no-sync pytest -q tests/models/test_model_loading.py tests/layers/test_patch_visualization.py

  parity:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12
      - run: uv pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: mae-*
          path: ${{ runner.temp }}/mae-parity
      - run: >-
          uv run --no-sync python tests/trainers/compare_mae_backends.py
          --tensorflow-evidence '${{ runner.temp }}/mae-parity/mae-tensorflow/mae-evidence.npz'
          --torch-evidence '${{ runner.temp }}/mae-parity/mae-torch/mae-evidence.npz'
